<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f2ed" />
    <title>Crear Servidor | Komodo Host</title>
    <link rel="icon" href="/images/favicon.png" />
    <link rel="stylesheet" href="/dashboard/dashboard.css" />
    <link rel="stylesheet" href="/dashboard/create/create.css" />
  </head>

  <body>
    <header class="topbar">
      <a href="/dashboard" class="brand brand-logo-only"><img src="/images/logo.png" alt="Komodo Host" /></a>
      <div class="topbar-guest" id="topBarGuest" style="display: none">
        <a href="/login" class="topbar-btn topbar-login">Log In</a>

        <a href="/signup" class="topbar-btn topbar-signup">Sign Up</a>
      </div>

      <div class="account-container" id="topBarAccount" style="display: none">
        <div class="account-bar">
          <button type="button" id="appsButton" class="apps-button" aria-label="Abrir menú de aplicaciones" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3.5" y="3.5" width="7" height="7" rx="1.8"></rect>
              <rect x="13.5" y="3.5" width="7" height="7" rx="1.8"></rect>
              <rect x="3.5" y="13.5" width="7" height="7" rx="1.8"></rect>
              <rect x="13.5" y="13.5" width="7" height="7" rx="1.8"></rect>
            </svg>
          </button>

          <button type="button" id="mailboxButton" class="mailbox-button" aria-label="Buzón">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2.5"></rect>
              <path d="M3.5 7l8.5 6.5L20.5 7"></path>
            </svg>
          </button>

          <button type="button" id="accountButton" class="account-button" aria-label="Abrir menú de cuenta" aria-expanded="false">
            <span id="accountInitial"> ? </span>
          </button>
        </div>

        <div id="appsMenu" class="apps-menu">
          <a href="/dashboard/host" class="apps-item apps-item-host">Komodo Host</a>

          <a href="/dashboard" class="apps-item apps-item-phone">Komodo Phone</a>

          <a href="/dashboard/ai-studio" class="apps-item apps-item-ai">Komodo AI Studio</a>
        </div>

        <div id="accountMenu" class="account-menu">
          <div class="account-info">
            <span class="account-info-label"> CUENTA </span>

            <span id="accountName" class="account-info-name"> Usuario </span>
          </div>

          <button type="button" id="accountLinkButton" class="settings-button">Cuenta</button>

          <button type="button" id="settingsButton" class="settings-button">Ajustes</button>

          <button type="button" id="logoutButton" class="logout-button">Cerrar sesión</button>
        </div>
      </div>
    </header>

    <main class="dashboard">
      <div class="dashboard-content">
        <section class="plans-header">
          <div class="plans-header-main">
            <div class="plans-header-icon">
              <img src="/images/service-preview.png" alt="Komodo Host" />
            </div>

            <div class="plans-header-info">
              <span class="welcome-label"> KOMODO HOST </span>

              <h1>Configura tu Servidor:</h1>
            </div>
          </div>

          <a href="/dashboard/host" class="plans-back-button">← Volver a Planes</a>
        </section>

        <section class="create-layout">
          <!-- Tarjeta de Resumen del Plan -->
          <article class="plan-summary">
            <div class="plan-summary-header">
              <span class="plan-card-label"> Resumen del Plan </span>
              <h2 id="summaryPlanName">Cargando...</h2>
            </div>
            <ul class="plan-features" id="summaryFeatures">
              <!-- Los datos se cargarán con JS -->
            </ul>
          </article>

          <!-- Formulario de Creación -->
          <article class="create-form-card">
            <form id="createForm">
              <div class="form-group">
                <label for="serverName">Nombre del Servidor</label>
                <input type="text" id="serverName" name="serverName" placeholder="Ej. Mi Bot de Discord" required minlength="3" maxlength="32" />
                <span class="form-help">Mínimo 3 caracteres, máximo 32.</span>
              </div>

              <div class="form-group">
                <label for="serverNode">Nodo / Ubicación</label>
                <select id="serverNode" name="serverNode">
                  <option value="node1-nicaragua" selected>Node 1 - Nicaragua</option>
                </select>
              </div>

              <div class="form-group">
                <label for="serverDescription">Descripción (Opcional)</label>
                <textarea id="serverDescription" name="serverDescription" placeholder="Un pequeño detalle de para qué usarás este servidor..." rows="3"></textarea>
              </div>

              <div class="form-actions">
                <button type="submit" id="submitBtn" class="service-panel-button">Crear Servidor</button>
              </div>
            </form>
          </article>
        </section>
      </div>
    </main>

    <script src="/dashboard/create/index.js"></script>
      <script src="/dashboard/topbar.js"></script>
  </body>
</html>
