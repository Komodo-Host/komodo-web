<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f2ed" />
    <title>Panel de Servidor | Komodo Host</title>
    <link rel="icon" href="/images/favicon.png" />
    <link rel="stylesheet" href="/dashboard/dashboard.css" />
    <link rel="stylesheet" href="/panel/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="" class="brand brand-logo-only"><img src="/images/logo.png" alt="Komodo Host" /><span class="brand-panel-label">Panel</span></a>

      <div class="account-container">
        <div class="account-bar">
          <button type="button" id="appsButton" class="apps-button" aria-label="Abrir menú de aplicaciones" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3.5" y="3.5" width="7" height="7" rx="1.8"></rect>
              <rect x="13.5" y="3.5" width="7" height="7" rx="1.8"></rect>
              <rect x="3.5" y="13.5" width="7" height="7" rx="1.8"></rect>
              <rect x="13.5" y="13.5" width="7" height="7" rx="1.8"></rect>
            </svg>
          </button>

          <button type="button" id="mailboxButton" class="mailbox-button" aria-label="Buzón">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2.5"></rect>
              <path d="M3.5 7l8.5 6.5L20.5 7"></path>
            </svg>
          </button>

          <button type="button" id="accountButton" class="account-button" aria-label="Abrir menú de cuenta" aria-expanded="false">
            <span id="accountInitial"> ? </span>
          </button>
        </div>

        <div id="appsMenu" class="apps-menu">
          <a href="/dashboard/host" class="apps-item apps-item-host">Planes Komodo Host</a>

          <div id="appsHostServers" class="apps-sublist">
            <span class="apps-sub-empty">Vacío</span>
          </div>

          <a href="/dashboard" class="apps-item apps-item-phone">Planes Komodo Phone</a>

          <div class="apps-sublist">
            <span class="apps-sub-empty">Vacío</span>
          </div>

          <a href="/dashboard/ai-studio" class="apps-item apps-item-ai">Planes Komodo AI Studio</a>

          <div id="appsAiKeys" class="apps-sublist">
            <span class="apps-sub-empty">Vacío</span>
          </div>
        </div>

        <div id="accountMenu" class="account-menu">
          <div class="account-info">
            <span class="account-info-label"> CUENTA </span>

            <span id="accountName" class="account-info-name"> Usuario </span>
          </div>

          <button type="button" id="accountLinkButton" class="settings-button">Cuenta</button>

          <button type="button" id="settingsButton" class="settings-button">Ir al Dashboard</button>

          <button type="button" id="logoutButton" class="logout-button">Cerrar sesión</button>
        </div>
      </div>
    </header>

    <div id="app" class="panel-shell">
      <!-- Índice de ubicación (fijo en todas las secciones) -->
      <div class="panel-gutter panel-crumbs-row">
        <div class="panel-inner panel-crumbs-inner">
          <nav class="panel-crumbs" aria-label="Ubicación">
            <img class="panel-crumbs-logo" src="/images/favicon.png" alt="" />
            <span class="panel-crumbs-brand">Komodo Host</span>
            <span class="panel-crumbs-sep">&gt;</span>
            <span class="panel-crumbs-server" id="crumbServerName">custom name</span>
            <span class="panel-crumbs-sep">&gt;</span>
            <span class="panel-crumbs-section" id="crumbSection">Overview</span>
          </nav>

          <!-- Nombre del servidor (fijo, a la derecha, encima de Iniciar / Reiniciar / Detener) -->
          <h1 class="panel-server-title" id="panelServerTitle">custom name</h1>
        </div>
      </div>

      <!-- Índice de secciones (fijo) -->
      <div class="panel-tabs-row">
        <div class="panel-gutter">
          <div class="panel-inner panel-tabs-inner">
            <nav class="panel-tabs" id="panelTabs" aria-label="Secciones del panel">
              <a href="#" class="panel-tab" data-section="overview">Overview</a>
              <a href="#" class="panel-tab" data-section="console">Console</a>
              <a href="#" class="panel-tab" data-section="files">Files</a>
              <a href="#" class="panel-tab" data-section="metrics">Metrics</a>
              <a href="#" class="panel-tab" data-section="settings">Settings</a>
            </nav>

            <div class="panel-actions">
              <button type="button" class="panel-action panel-action-start">Iniciar</button>
              <button type="button" class="panel-action panel-action-restart">Reiniciar</button>
              <button type="button" class="panel-action panel-action-stop">Detener</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Elementos que usa loadServerData() (no se tocan) -->
      <span id="serverName" hidden></span>
      <span id="serverStatus" hidden></span>

      <div class="panel-gutter">
        <div class="panel-inner">
          <div id="errorMsg" class="panel-error" style="display: none;"></div>

          <!-- Aquí se inyecta la sección activa -->
          <main id="panelContent" class="panel-content"></main>
        </div>
      </div>
    </div>

    <script src="/panel/index.js"></script>
      <script src="/dashboard/topbar.js"></script>
  </body>
</html>
